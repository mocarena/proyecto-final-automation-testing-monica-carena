[pytest]
testpaths = 
    tests
    tests_api
    tests_behave
addopts = -v --html=reports/report.html --self-contained-html
python_files = test_*.py
markers =
    smoke: pruebas de verificacion basica
    api: pruebas de servicios API
    e2e: pruebas de flujo completo end to end
    bdd: pruebas de comportamiento con Behave
    regression: pruebas de regresion
